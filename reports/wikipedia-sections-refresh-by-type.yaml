# data-monitoring report manifest - Wikipedia refresh, per content family.
#
# Companion to `wikipedia-sections-refresh.yaml`: same campaign (the H2+H3
# fine-section split live on 2026-07-20 23:00 Paris), broken down per content family
# of the crawler.
#
# WHY A SECOND MANIFEST
# ---------------------
# wikipedia_crawler.py walks its process list one family at a time (arrprocesses,
# ids 201..223), so the campaign does not advance uniformly: a family sits at 0% until
# its process runs, then jumps to ~100%. A single global percentage hides that. The
# metrics below follow the crawler's quick-mode priority list (arrquickprocessids),
# so reading the report top to bottom reads the campaign plan.
#
# ANCHORED IN THE SOURCE TABLE, NOT IN ITEM_TYPE   (fixed 2026-08-11)
# -------------------------------------------------------------------
# These metrics used to count rows of T_WC_WIKIPEDIA_PAGE_LANG carrying
# ITEM_TYPE = '<family>', on BOTH sides of the fraction. That column records which
# PROCESS WROTE THE ROW, not which family the entity belongs to, and most
# T_WC_T2S_* families never write any: process 203 item crawls the whole of
# T_WC_WIKIDATA_ITEM_V1 and runs first, so an award that is also a Wikidata item is
# crawled AS AN ITEM and 215 award selects 0 rows.
#
# Measured on the 31000 Qids of T_WC_T2S_AWARD: 16258 of their pages are stored under
# ITEM_TYPE 'item', 7010 'movie', 6881 'person', 925 'serie', 2 'list', and ZERO
# 'award'. The card read 0 done / 0 expected and printed "-", which was read as "not
# crawled yet" when the truth was the opposite: crawled in full, under another name.
#
# Every metric now takes its denominator from the family's own SOURCE TABLE (the
# `sourcetable` column of CONTENT_CONFIG in wikipedia-crawler/wikipedia_page_writer.py)
# and joins T_WC_WIKIPEDIA_PAGE_LANG on ID_WIKIDATA with NO ITEM_TYPE filter. The
# question asked is "of this family's entities, how many have a freshly crawled
# Wikipedia page", whoever crawled it.
#
# CONSEQUENCES
# ------------
# - The families no longer partition. A Qid in both T_WC_T2S_AWARD and
#   T_WC_WIKIDATA_ITEM_V1 counts in BOTH cards, so the per-family counts do NOT sum
#   to the global total of wikipedia-sections-refresh.yaml. Intended: these are
#   per-family coverage figures, not a breakdown of one total.
# - The denominator counts source Qids THAT ALREADY HAVE A PAGE ROW, so 100% stays
#   reachable. An entity whose Wikipedia page has never been fetched at all is out of
#   scope here and belongs to a coverage report, not to a refresh report.
# - `table:` stays T_WC_WIKIPEDIA_PAGE_LANG on every metric. It is part of the
#   snapshot identity (source_db, table, key) in data-monitoring.py, so changing it
#   would orphan the history behind each card.
# - A zero now means what it says: this family's pages have not been re-crawled since
#   the switch.

slug: wikipedia-sections-refresh-by-type
title: "Wikipedia - refresh coverage by content family"
source_db: WIKIPEDIA
description: >
  Per-family breakdown of the Wikipedia re-crawl since the fine-section split went
  live on 2026-07-20 23:00 (Paris). Each metric is the share of that family's source
  Wikidata IDs whose Wikipedia page has been crawled at or after the switch, whichever
  crawler process did it. Families are listed in the crawler's own priority order.

params:
  cutoff: "2026-07-20 23:00:00"

metrics:
  - key: refresh_type_other
    table: T_WC_WIKIPEDIA_PAGE_LANG
    description: "other (process 209)"
    long_desc: >
      Distinct ID_WIKIDATA of the hard-coded Qid Q1204187 whose Wikipedia page row was crawled
      at or after the switch, over all of that family's Qids that have a page row. Not
      filtered on ITEM_TYPE. A single hard-coded Qid, so this card is a yes/no.
    warn_below: 50
    rate_label: "Wikidata IDs/day"
    done_sql: >
      SELECT COUNT(DISTINCT p.ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG p
      JOIN (SELECT 'Q1204187' AS ID_WIKIDATA) s ON s.ID_WIKIDATA = p.ID_WIKIDATA
      WHERE p.LAST_CRAWLED_AT >= '{cutoff}'
    expected_sql: >
      SELECT COUNT(DISTINCT p.ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG p
      JOIN (SELECT 'Q1204187' AS ID_WIKIDATA) s ON s.ID_WIKIDATA = p.ID_WIKIDATA

  - key: refresh_type_item
    table: T_WC_WIKIPEDIA_PAGE_LANG
    description: "item (process 203)"
    long_desc: >
      Distinct ID_WIKIDATA of T_WC_WIKIDATA_ITEM_V1 whose Wikipedia page row was crawled at or
      after the switch, over all of that family's Qids that have a page row. Not filtered on
      ITEM_TYPE. Largest family after person/movie, and the one that absorbs most of the
      T_WC_T2S_* families below.
    warn_below: 50
    rate_label: "Wikidata IDs/day"
    done_sql: >
      SELECT COUNT(DISTINCT p.ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG p
      JOIN (SELECT DISTINCT ID_WIKIDATA FROM T_WC_WIKIDATA_ITEM_V1 WHERE ID_WIKIDATA REGEXP '^Q[0-9]+$') s ON s.ID_WIKIDATA = p.ID_WIKIDATA
      WHERE p.LAST_CRAWLED_AT >= '{cutoff}'
    expected_sql: >
      SELECT COUNT(DISTINCT p.ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG p
      JOIN (SELECT DISTINCT ID_WIKIDATA FROM T_WC_WIKIDATA_ITEM_V1 WHERE ID_WIKIDATA REGEXP '^Q[0-9]+$') s ON s.ID_WIKIDATA = p.ID_WIKIDATA

