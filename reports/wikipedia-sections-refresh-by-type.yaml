# data-monitoring report manifest - Wikipedia refresh, per content family.
#
# Companion to `wikipedia-sections-refresh.yaml`: same campaign (the H2+H3
# fine-section split live on 2026-07-20 23:00 Paris), same denominator logic, but
# broken down by T_WC_WIKIPEDIA_PAGE_LANG.ITEM_TYPE - the crawler's content family.
#
# WHY A SECOND MANIFEST
# ---------------------
# wikipedia_crawler.py walks its process list one family at a time (arrprocesses,
# ids 201..223), so the campaign does not advance uniformly: a family is at 0% until
# its process runs, then jumps to ~100%. A single global percentage hides that. The
# metrics below are ordered exactly like the crawler's quick-mode priority list
# (arrquickprocessids, stalest ITEM_TYPE first), so reading the report top to bottom
# reads the campaign plan: what is done, what is running, what has not started.
#
# ITEM_TYPE CAVEAT
# ----------------
# T_WC_WIKIPEDIA_PAGE_LANG is unique on (ID_WIKIDATA, LANG), so ITEM_TYPE is
# whatever the LAST process to write that row set. A Wikidata ID targeted by two
# processes (a character reachable as both 205 and 218, an item also present in a
# T2S list) is therefore counted once, under the family that touched it last. The
# per-family counts still sum to the global total.
#
# A zero here means "the crawler has not reached this family yet", never "upstream
# has no value". Families with a small denominator (season, keyword, death, …)
# flip from 0% to ~100% in a single run.

slug: wikipedia-sections-refresh-by-type
title: "Wikipedia - refresh coverage by content family"
source_db: WIKIPEDIA
description: >
  Per-ITEM_TYPE breakdown of the Wikipedia re-crawl since the fine-section split
  went live on 2026-07-20 23:00 (Paris). Each metric is the share of that family's
  Wikidata IDs whose page rows have been crawled at or after the switch. Families
  are listed in the crawler's own priority order (stalest first).

params:
  cutoff: "2026-07-20 23:00:00"

metrics:
  - key: refresh_type_collection
    table: T_WC_WIKIPEDIA_PAGE_LANG
    description: "collection (process 212)"
    long_desc: "Distinct ID_WIKIDATA of ITEM_TYPE 'collection' crawled at or after the switch, over all of that family."
    warn_below: 50
    rate_label: "Wikidata IDs/day"
    done_sql: "SELECT COUNT(DISTINCT ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG WHERE ITEM_TYPE = 'collection' AND LAST_CRAWLED_AT >= '{cutoff}'"
    expected_sql: "SELECT COUNT(DISTINCT ID_WIKIDATA) FROM T_WC_WIKIPEDIA_PAGE_LANG WHERE ITEM_TYPE = 'collection'"

  - key: refresh_type_group
    table: T_WC_WIKIPEDIA_PAGE_LANG
